name: Build Home Menu APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Download fonts (Nunito, Lora)
        run: bash scripts/fetch_fonts.sh

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit + Robolectric UI tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-menu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  instrumented:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: pixel_4
          - api: 34
            profile: pixel_tablet
    steps:
      - name: Free disk space for emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/lib/jvm/java-8* /usr/lib/jvm/java-11* || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle wrapper --gradle-version 8.7
      - run: bash scripts/fetch_fonts.sh
      # Build both APKs before the emulator starts and stop the Gradle/Kotlin daemons (-Xmx4g each):
      # on the 2-core / 7 GB runner they compete with the emulator (4 GB) for memory,
      # and the runner can be shut down in the middle of the tests.
      - name: Build app and test APKs before the emulator starts
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: connectedAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
