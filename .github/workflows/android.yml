name: Build Home Menu APK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Task 8: every CI APK gets a higher versionCode than the previous run (see app/build.gradle.kts).
  HOMEMENU_VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing: ${{ steps.key.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Download fonts (Nunito, Lora)
        run: bash scripts/fetch_fonts.sh
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit + Robolectric UI tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-menu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      # Task 8: permanent release key from GitHub Secrets. The key file lives only in the runner temp dir.
      - name: Decode release signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.HOMEMENU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No HOMEMENU_KEYSTORE_BASE64 secret: only the debug APK is built. Debug APKs are signed with a random key per run and cannot be installed over each other."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/homemenu-release.jks"
          echo "HOMEMENU_KEYSTORE_FILE=$RUNNER_TEMP/homemenu-release.jks" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Assemble signed release APK
        if: steps.key.outputs.present == 'true'
        env:
          HOMEMENU_KEYSTORE_PASSWORD: ${{ secrets.HOMEMENU_KEYSTORE_PASSWORD }}
          HOMEMENU_KEY_ALIAS: ${{ secrets.HOMEMENU_KEY_ALIAS }}
          HOMEMENU_KEY_PASSWORD: ${{ secrets.HOMEMENU_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed release APK was not produced (check the signing secrets)"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee release-signing-certificate.txt
          grep -q "SHA-256" release-signing-certificate.txt
          echo "versionCode=$HOMEMENU_VERSION_CODE" >> release-signing-certificate.txt
          mv "$APK" "app/build/outputs/apk/release/home-menu-${HOMEMENU_VERSION_CODE}.apk"
      - name: Upload signed release APK
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: home-menu-release-apk
          path: |
            app/build/outputs/apk/release/home-menu-*.apk
            release-signing-certificate.txt
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/homemenu-release.jks"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  instrumented:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: pixel_4
          - api: 34
            profile: pixel_tablet
    steps:
      - name: Free disk space for emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/lib/jvm/java-8* /usr/lib/jvm/java-11* || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle wrapper --gradle-version 8.7
      - run: bash scripts/fetch_fonts.sh
      # Build both APKs before the emulator starts and stop the Gradle/Kotlin daemons (-Xmx4g each):
      # on the 2-core / 7 GB runner they compete with the emulator (4 GB) for memory,
      # and the runner can be shut down in the middle of the tests.
      - name: Build app and test APKs before the emulator starts
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: connectedAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  # Task 8: real update over an existing installation, signed with the permanent key.
  # Runs only when the signing secrets exist (otherwise there is no key that could make an update possible).
  update-check:
    needs: build
    if: needs.build.outputs.signing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/lib/jvm/java-8* /usr/lib/jvm/java-11* || true
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle wrapper --gradle-version 8.7
      - run: bash scripts/fetch_fonts.sh
      - name: Build older and newer signed APKs
        env:
          KEYSTORE_B64: ${{ secrets.HOMEMENU_KEYSTORE_BASE64 }}
          HOMEMENU_KEYSTORE_PASSWORD: ${{ secrets.HOMEMENU_KEYSTORE_PASSWORD }}
          HOMEMENU_KEY_ALIAS: ${{ secrets.HOMEMENU_KEY_ALIAS }}
          HOMEMENU_KEY_PASSWORD: ${{ secrets.HOMEMENU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/homemenu-release.jks"
          export HOMEMENU_KEYSTORE_FILE="$RUNNER_TEMP/homemenu-release.jks"
          NEW_CODE="$HOMEMENU_VERSION_CODE"
          OLD_CODE=$((NEW_CODE - 1))
          HOMEMENU_VERSION_CODE="$OLD_CODE" ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/old.apk"
          HOMEMENU_VERSION_CODE="$NEW_CODE" ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/new.apk"
          rm -f "$RUNNER_TEMP/homemenu-release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/old.apk" | grep SHA-256)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/new.apk" | grep SHA-256)
          echo "old: $OLD_CERT"; echo "new: $NEW_CERT"
          [ "$OLD_CERT" = "$NEW_CERT" ]
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install newer APK over the older one and compare data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 3072M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/update_check.sh "$GITHUB_WORKSPACE/old.apk" "$GITHUB_WORKSPACE/new.apk"
