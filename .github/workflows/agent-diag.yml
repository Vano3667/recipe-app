name: agent-diag
on:
  push:
    branches: [agent-diag]
  workflow_dispatch: {}
jobs:
  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dump docs
        run: |
          echo '==== README modernization'; git show origin/modernization:README.md
          echo '==== README main'; git show origin/main:README.md | head -20
          echo '==== END'
