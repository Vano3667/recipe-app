name: agent-diag
on:
  push:
    branches: [agent-diag]
  workflow_dispatch: {}
jobs:
  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump sources
        run: |
          B=app/src/main/java/com/example/homemenu
          echo '==== BM 120-276'; sed -n '120,276p' $B/data/files/BackupManager.kt
          for f in $B/data/files/PhotoStorage.kt $B/data/db/AppDatabase.kt $B/data/db/Daos.kt $B/data/Mappers.kt $B/ui/recipes/IngredientOrder.kt; do echo "==== FILE $f"; cat "$f"; done
          echo '==== MIG head'; sed -n '1,90p' app/src/test/java/com/example/homemenu/data/db/MigrationV1toV2Test.kt
          echo '==== END'
